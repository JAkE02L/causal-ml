[project]
name = "causal-ml"
version = "0.1.0"
description = "Causal Inference and Machine Learning experiments in Python"
readme = "README.md"
authors = [
    { name = "Jose Andres Enriquez", email = "jjandres1997@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
]

[project.scripts]
causal-ml = "causal_ml:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
